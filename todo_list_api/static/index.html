<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarti's Notes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f4f6fb; color: #20243a; }
    .page { max-width: 900px; margin: 48px auto; padding: 0 20px; }
    header { margin-bottom: 28px; }
    .eyebrow { color: #6d63d9; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: 34px; }
    .sub { color: #73788c; margin: 0; }
    .panel { background: white; border: 1px solid #e7e9f2; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px rgba(35, 39, 70, .05); }
    h2 { margin: 0 0 18px; font-size: 19px; }
    .form-grid { display: grid; grid-template-columns: 110px 1fr; gap: 14px; }
    label { display: block; margin-bottom: 7px; color: #555b70; font-size: 13px; font-weight: 700; }
    input, textarea { width: 100%; border: 1px solid #dfe2ed; border-radius: 9px; padding: 11px 12px; font: inherit; outline: none; }
    input:focus, textarea:focus { border-color: #756be4; box-shadow: 0 0 0 3px #756be41c; }
    textarea { min-height: 88px; resize: vertical; }
    .full { grid-column: 1 / -1; }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    button { border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
    .primary { background: #6d63d9; color: white; }
    .secondary { background: #eef0f7; color: #4d5368; }
    .danger { background: #fff0f0; color: #c43d49; }
    .notes-head { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 14px; }
    .notes-head h2 { margin: 0; }
    #status { min-height: 20px; margin-top: 12px; color: #596078; font-size: 13px; }
    #notes { display: grid; gap: 12px; }
    .note { background: white; border: 1px solid #e7e9f2; border-radius: 13px; padding: 18px; display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .note h3 { margin: 0 0 7px; font-size: 17px; }
    .note p { margin: 0; color: #73788c; white-space: pre-wrap; line-height: 1.5; }
    .note-id { color: #8b90a2; font-size: 12px; margin-bottom: 6px; }
    .note-buttons { display: flex; gap: 8px; flex-shrink: 0; }
    .empty { color: #858a9c; text-align: center; padding: 30px; background: white; border: 1px dashed #d9dce8; border-radius: 13px; }
    @media (max-width: 600px) { .page { margin: 28px auto; } .form-grid { grid-template-columns: 1fr; } .full { grid-column: auto; } .note { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">FastAPI CRUD project</div>
      <h1>My Notes ✨</h1>
      <p class="sub">Create, view, update and delete your notes.</p>
    </header>

    <section class="panel">
      <h2 id="formHeading">Add a new note</h2>
      <form id="noteForm">
        <div class="form-grid">
          <div>
            <label for="noteId">Note ID</label>
            <input id="noteId" type="number" min="1" placeholder="e.g. 1" required />
          </div>
          <div>
            <label for="title">Title</label>
            <input id="title" type="text" placeholder="Enter note title" required />
          </div>
          <div class="full">
            <label for="description">Description</label>
            <textarea id="description" placeholder="Write your note..." required></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="saveButton" type="submit">Add note</button>
          <button class="secondary" id="cancelButton" type="button" hidden>Cancel edit</button>
        </div>
      </form>
      <div id="status" role="status"></div>
    </section>

    <div class="notes-head">
      <h2>Your notes</h2>
      <button class="secondary" id="refreshButton" type="button">Refresh</button>
    </div>
    <section id="notes" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById('noteForm');
    const idInput = document.getElementById('noteId');
    const titleInput = document.getElementById('title');
    const descriptionInput = document.getElementById('description');
    const notesContainer = document.getElementById('notes');
    const statusBox = document.getElementById('status');
    let editingId = null;

    function showStatus(message) { statusBox.textContent = message; }

    async function loadNotes() {
      try {
        const response = await fetch('/notes');
        if (!response.ok) throw new Error('Could not load notes.');
        const notes = await response.json();
        notesContainer.replaceChildren();
        if (notes.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No notes yet. Add your first note above!';
          notesContainer.appendChild(empty);
          return;
        }
        notes.forEach(note => {
          const card = document.createElement('article');
          card.className = 'note';
          const content = document.createElement('div');
          const id = document.createElement('div');
          id.className = 'note-id';
          id.textContent = `NOTE #${note.id}`;
          const title = document.createElement('h3');
          title.textContent = note.title;
          const description = document.createElement('p');
          description.textContent = note.description;
          content.append(id, title, description);

          const buttons = document.createElement('div');
          buttons.className = 'note-buttons';
          const editButton = document.createElement('button');
          editButton.className = 'secondary';
          editButton.textContent = 'Edit';
          editButton.addEventListener('click', () => startEdit(note));
          const deleteButton = document.createElement('button');
          deleteButton.className = 'danger';
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', () => deleteNote(note.id));
          buttons.append(editButton, deleteButton);
          card.append(content, buttons);
          notesContainer.appendChild(card);
        });
      } catch (error) { showStatus(error.message); }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const note = {
        id: Number(idInput.value),
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim()
      };
      const isEditing = editingId !== null;
      const url = isEditing ? `/notes/${editingId}` : '/notes';
      const method = isEditing ? 'PUT' : 'POST';
      try {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(note)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Request failed.');
        if (result.message === 'note not found') throw new Error('Note not found.');
        showStatus(isEditing ? 'Note updated successfully!' : 'Note added successfully!');
        resetForm();
        await loadNotes();
      } catch (error) { showStatus(error.message); }
    });

    function startEdit(note) {
      editingId = note.id;
      idInput.value = note.id;
      idInput.disabled = true;
      titleInput.value = note.title;
      descriptionInput.value = note.description;
      document.getElementById('formHeading').textContent = 'Update note';
      document.getElementById('saveButton').textContent = 'Save changes';
      document.getElementById('cancelButton').hidden = false;
      showStatus(`Editing note #${note.id}`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      form.reset();
      editingId = null;
      idInput.disabled = false;
      document.getElementById('formHeading').textContent = 'Add a new note';
      document.getElementById('saveButton').textContent = 'Add note';
      document.getElementById('cancelButton').hidden = true;
    }

    async function deleteNote(id) {
      if (!confirm(`Delete note #${id}?`)) return;
      try {
        const response = await fetch(`/notes/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Could not delete note.');
        showStatus(result.message === 'note deleted' ? 'Note deleted.' : 'Note not found.');
        if (editingId === id) resetForm();
        await loadNotes();
      } catch (error) { showStatus(error.message); }
    }

    document.getElementById('cancelButton').addEventListener('click', resetForm);
    document.getElementById('refreshButton').addEventListener('click', loadNotes);
    loadNotes();
  </script>
</body>
</html>
